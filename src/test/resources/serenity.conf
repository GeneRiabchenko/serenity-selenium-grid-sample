webdriver {
  driver = "remote"
  remote.url = "http://localhost:4444/wd/hub"
  remote.driver = "chrome"
  base.url = "http://app"
  autodownload = false
  timeouts.implicitlywait = 2000
}

headless.mode = true

serenity {
  take.screenshots = FOR_FAILURES
  restart.browser.each.scenario = false
  console.colors = true
}

chrome.switches = "--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1440,900"
